# Structural backbone of the ODIN plugin marketplace.
# Written by the graph-backbone procedure and read by its status consumer.
# No code-changing workflow depends on this file.
#
# Nodes and edges are immutable within a revision. Any change to either creates a new
# revision and appends a transition. A declared gate may replan focus without touching
# topology. Decision nodes carry status: closed decisions name the rival they rejected,
# and open decisions name the hazard that blocks them.

schema: odin.graph/v1
revision: r1-foundry-2.0

nodes:
  - id: inv-baseline-cascade
    type: Invariant
    label: "Doctrine cascade is byte-identical from the charter role to EOF across all six output styles"
  - id: inv-name-equals-directory
    type: Invariant
    label: "Skill frontmatter name equals its directory name, or the installer drops the skill"
  - id: inv-flat-skills
    type: Invariant
    label: "A skill is authored once at plugins/<plugin>/skills/<slug>/SKILL.md and nests no deeper"
  - id: inv-generator-owned
    type: Invariant
    label: "All 144 generated surfaces derive from the catalog and are never hand-edited"
  - id: inv-lockstep-version
    type: Invariant
    label: "All 28 plugins and 3 registries carry one canonical releaseVersion"
  - id: inv-strict-yaml
    type: Invariant
    label: "Every SKILL.md frontmatter parses under a strict YAML parser, not only a lenient loader"
  - id: inv-attribution-travels
    type: Invariant
    label: "Every skill derived from a licensed upstream ships that upstream's notice"
  - id: inv-voice-contract
    type: Invariant
    label: "Authored prose satisfies the voice contract, including its bold-label rule"
  - id: inv-review-record
    type: Invariant
    label: "Inline review comments stay attached to commits that remain reachable"
  - id: inv-evidence-observed
    type: Invariant
    label: "Every claimed write is verified by reading it back, never by a tool's success code"
  - id: sfc-skill-body
    type: Surface
    label: "613 authored skill bodies, the only human-written skill artifact"
  - id: sfc-plugin-manifest
    type: Surface
    label: "28 plugin.json manifests under the closed Agent Plugins schema"
  - id: sfc-skill-manifest
    type: Surface
    label: "613 agents/openai.yaml skill manifests for the Codex surface"
  - id: sfc-claude-marketplace
    type: Surface
    label: ".claude-plugin/marketplace.json, the Claude Code registry"
  - id: sfc-agents-marketplace
    type: Surface
    label: ".agents/plugins/marketplace.json, the Agent Plugins registry"
  - id: sfc-cursor-marketplace
    type: Surface
    label: ".cursor-plugin/marketplace.json, the Cursor registry"
  - id: sfc-output-styles
    type: Surface
    label: "6 output styles, each embedding the full canonical baseline at its tail"
  - id: sfc-generator
    type: Surface
    label: "The render scripts, sole writer of every generated surface"
  - id: sfc-gate-suite
    type: Surface
    label: "14 pre-commit hooks, the only automated judge of the tree"
  - id: str-catalog
    type: Store
    label: "catalog/plugins.json, the single source of plugin identity"
  - id: str-notice
    type: Store
    label: "licenses/NOTICE, the attribution and provenance ledger"
  - id: str-baseline
    type: Store
    label: "system-prompt-baseline.md, the canonical doctrine"
  - id: str-gates
    type: Store
    label: "GATES.md, the append-only gate ledger carrying evidence and abandonment"
  - id: haz-force-push
    type: Hazard
    label: "Rewriting published history strands inline review comments with no error"
  - id: haz-write-jail
    type: Hazard
    label: "A write jail denies the write while the tool reports a path that never landed"
  - id: haz-generator-drift
    type: Hazard
    label: "A hand edit to a generated surface is silently reverted by the next render"
  - id: haz-gate-evasion
    type: Hazard
    label: "A gate whose pattern can be evaded reports clean over a defect it cannot see"
  - id: haz-relative-path
    type: Hazard
    label: "A sibling worktree resolves a relative path against the wrong root and edits the wrong tree"
  - id: haz-parser-divergence
    type: Hazard
    label: "A lenient loader accepts frontmatter that the installer's strict parser rejects"
  - id: haz-attribution-loss
    type: Hazard
    label: "Consolidation keeps the derived work and drops the notice that licenses it"
  - id: dec-four-surfaces
    type: Decision
    label: "Four distribution surfaces and no package registry; npm was retired, not mirrored"
    status: closed
  - id: dec-28-plugins
    type: Decision
    label: "28 category plugins addressed by directory, rejecting a membership registry"
    status: closed
  - id: dec-single-home
    type: Decision
    label: "One authored home per skill; directory states ownership, so no second tree"
    status: closed
  - id: dec-no-backcompat
    type: Decision
    label: "No compatibility layer; every caller migrates inside the change that breaks it"
    status: closed
  - id: haz-authority-withheld
    type: Hazard
    label: "External authority is not held, so a step can be prepared but never attempted"
  - id: dec-approval-authority
    type: Decision
    label: "Authority to cause dangerous external effects is not yet granted"
    status: open
  - id: dec-upstream-resolver
    type: Decision
    label: "Upstream merge and a released harness version carrying the resolver"
    status: open
  - id: dec-native-runner-proof
    type: Decision
    label: "Native runner proofs across the harnesses that claim support"
    status: open
  - id: dec-installer-receipts
    type: Decision
    label: "Installer artifacts sealed with verified receipts"
    status: open
  - id: dec-methodology-publish
    type: Decision
    label: "Methodology published only after a deterministic proof"
    status: open
  - id: dec-site-deploy
    type: Decision
    label: "Site deployed only after its proof receipts land"
    status: open
  - id: dec-repo-archive
    type: Decision
    label: "Predecessor repositories archived only after a successor proof"
    status: open
  - id: dec-org-pins
    type: Decision
    label: "Organization pins set as the final mutation of the ladder"
    status: open
  - id: dec-ladder-reconcile
    type: Decision
    label: "The blocked release ladder reconciled against the restructured tree"
    status: open

