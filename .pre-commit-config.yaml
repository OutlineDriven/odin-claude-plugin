# Gates for the skill tree and its four distribution surfaces.
# Run the whole set with: prek run --all-files
repos:
  # General text cleanup for markdown and JSON files
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # Remove trailing whitespace
      - id: trailing-whitespace
        types_or: [markdown, json]

      # Validate JSON syntax
      - id: check-json

      # Fix mixed line endings (convert to LF)
      - id: mixed-line-ending
        args: ["--fix=lf"]
        types_or: [markdown, json]

      # Fix UTF-8 byte order marker
      - id: fix-byte-order-marker
        types_or: [markdown, json]

  # TOML lint + format
  - repo: https://github.com/tombi-toml/tombi-pre-commit
    rev: v1.5.0
    hooks:
      - id: tombi-lint
        args: ["--offline"]
      - id: tombi-format

  # Every local hook below audits the whole tree and takes no filenames. A `files:`
  # selector on such a hook is a second, hand-maintained model of what the check
  # depends on, and that model was silently wrong six times during the 2.0 rebuild:
  # three marketplace registries missing from the surface gates, a shared module
  # missing from the skill gates, the generated root README missing from both, and
  # the voice gate matching three directories while its script audits every tracked
  # markdown file. A whole-tree check must not be conditional on which file the
  # author happened to touch, so these run unconditionally and carry no selector to
  # drift. The full set costs a few seconds.
  - repo: local
    hooks:
      - id: sync-baseline
        name: sync output-style doctrine cascade
        entry: python3 scripts/sync-baseline.py
        language: system
        pass_filenames: false
        always_run: true

      - id: check-plugin-surfaces
        name: check plugin tree, manifests, and registries
        entry: node scripts/check-plugin-surfaces.mjs
        language: system
        pass_filenames: false
        always_run: true

      - id: render-plugin-surfaces
        name: check generated plugin surfaces match the catalog
        entry: node scripts/render-plugin-surfaces.mjs --check
        language: system
        pass_filenames: false
        always_run: true

      - id: check-skill-routes
        name: check skill routes and manifest identity
        entry: node scripts/check-skill-routes.mjs
        language: system
        pass_filenames: false
        always_run: true

      - id: check-voice
        name: check authored prose against the voice contract
        entry: python3 scripts/check-voice.py
        language: system
        pass_filenames: false
        always_run: true

      # Both gates below have shipped a wrong rule at least once, so each carries
      # its own fixtures and proves itself on every run.
      - id: check-voice-self-test
        name: check the voice gate against its own fixtures
        entry: python3 scripts/check-voice.py --self-test
        language: system
        pass_filenames: false
        always_run: true

      - id: check-skill-frontmatter-self-test
        name: check the frontmatter gate against its own fixtures
        entry: python3 scripts/check-skill-frontmatter.py --self-test
        language: system
        pass_filenames: false
        always_run: true

      - id: render-skill-manifests
        name: check skill manifests match SKILL.md frontmatter
        entry: node scripts/render-skill-manifests.mjs --check
        language: system
        pass_filenames: false
        always_run: true

      - id: check-skill-frontmatter
        name: check SKILL.md frontmatter parses as strict YAML
        entry: python3 scripts/check-skill-frontmatter.py
        language: system
        pass_filenames: false
        always_run: true
