# Pre-commit hooks for markdown and JSON text cleanup
repos:
  # General text cleanup for markdown and JSON files
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # Remove trailing whitespace
      - id: trailing-whitespace
        types_or: [markdown, json]

      # Validate JSON syntax
      - id: check-json

      # Fix mixed line endings (convert to LF)
      - id: mixed-line-ending
        args: ["--fix=lf"]
        types_or: [markdown, json]

      # Fix UTF-8 byte order marker
      - id: fix-byte-order-marker
        types_or: [markdown, json]

  # TOML lint + format
  - repo: https://github.com/tombi-toml/tombi-pre-commit
    rev: v1.1.3
    hooks:
      - id: tombi-lint
        args: ["--offline"]
      - id: tombi-format

  # Regenerate the doctrine cascade embedded in every output-style.
  # pass_filenames is off on purpose: editing the canonical alone must still
  # resync all six styles, and pre-commit would only hand us the canonical.
  - repo: local
    hooks:
      - id: sync-baseline
        name: sync output-style doctrine cascade
        entry: python3 scripts/sync-baseline.py
        language: system
        files: ^(system-prompt-baseline\.md|packages/odin-core/output-styles/.*\.md)$
        pass_filenames: false

      - id: check-package-surfaces
        name: check 29-package surfaces and NOTICE
        entry: bash -c "node scripts/check-package-surfaces.mjs"
        language: system
        files: ^(catalog/.*|packages/.*|licenses/NOTICE|scripts/(package-surfaces|render-package-surfaces|check-package-surfaces|skill-membership)\.mjs|\.claude-plugin/marketplace\.json|package\.json|LICENSE)$
        pass_filenames: false

      - id: check-skill-routes
        name: check skill routes, registry count, and manifest identity
        entry: node scripts/check-skill-routes.mjs
        language: system
        files: ^(skills/.*/SKILL\.md|skills/.*/agents/openai\.yaml|catalog/skill-membership\.json|scripts/check-skill-routes\.mjs|scripts/render-skill-manifests\.mjs)$
        pass_filenames: false

      - id: render-skill-manifests
        name: check skill manifests match SKILL.md frontmatter
        entry: node scripts/render-skill-manifests.mjs --check
        language: system
        files: ^(skills/.*/SKILL\.md|skills/.*/agents/openai\.yaml|scripts/render-skill-manifests\.mjs)$
        pass_filenames: false
