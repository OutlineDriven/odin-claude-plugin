# Gates for the skill tree and its four distribution surfaces.
# Run the whole set with: prek run --all-files
repos:
  # General text cleanup for markdown and JSON files
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # Remove trailing whitespace
      - id: trailing-whitespace
        types_or: [markdown, json]

      # Validate JSON syntax
      - id: check-json

      # Fix mixed line endings (convert to LF)
      - id: mixed-line-ending
        args: ["--fix=lf"]
        types_or: [markdown, json]

      # Fix UTF-8 byte order marker
      - id: fix-byte-order-marker
        types_or: [markdown, json]

  # TOML lint + format
  - repo: https://github.com/tombi-toml/tombi-pre-commit
    rev: v1.5.0
    hooks:
      - id: tombi-lint
        args: ["--offline"]
      - id: tombi-format

  # Regenerate the doctrine cascade embedded in every output-style.
  # pass_filenames is off on purpose: editing the canonical alone must still
  # resync all six styles, and pre-commit would only hand us the canonical.
  - repo: local
    hooks:
      - id: sync-baseline
        name: sync output-style doctrine cascade
        entry: python3 scripts/sync-baseline.py
        language: system
        files: ^(system-prompt-baseline\.md|plugins/odin-core/output-styles/.*\.md)$
        pass_filenames: false

      - id: check-plugin-surfaces
        name: check plugin tree, manifests, and registries
        entry: node scripts/check-plugin-surfaces.mjs
        language: system
        files: ^(catalog/plugins\.json|plugins/.*|licenses/NOTICE|scripts/(plugin-surfaces|render-plugin-surfaces|check-plugin-surfaces)\.mjs|LICENSE)$
        pass_filenames: false

      - id: render-plugin-surfaces
        name: check generated plugin surfaces match the catalog
        entry: node scripts/render-plugin-surfaces.mjs --check
        language: system
        files: ^(catalog/plugins\.json|plugins/.*|licenses/NOTICE|scripts/(plugin-surfaces|render-plugin-surfaces)\.mjs|LICENSE)$
        pass_filenames: false

      - id: check-skill-routes
        name: check skill routes and manifest identity
        entry: node scripts/check-skill-routes.mjs
        language: system
        files: ^(plugins/.*/skills/.*/SKILL\.md|plugins/.*/skills/.*/agents/openai\.yaml|catalog/plugins\.json|scripts/(check-skill-routes|render-skill-manifests)\.mjs)$
        pass_filenames: false

      - id: check-voice
        name: check authored prose against the voice contract
        entry: python3 scripts/check-voice.py
        language: system
        files: ^(plugins/.*/skills/.*\.md|docs/.*\.md|AGENTS\.md|scripts/check-voice\.py)$
        pass_filenames: false

      - id: render-skill-manifests
        name: check skill manifests match SKILL.md frontmatter
        entry: node scripts/render-skill-manifests.mjs --check
        language: system
        files: ^(plugins/.*/skills/.*/SKILL\.md|plugins/.*/skills/.*/agents/openai\.yaml|scripts/render-skill-manifests\.mjs)$
        pass_filenames: false
